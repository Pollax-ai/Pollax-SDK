name: Feature request
description: Suggest an improvement or new SDK method
labels: ["enhancement"]
body:
  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      options:
        - TypeScript / JavaScript
        - Python
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Method names, endpoints, and example usage if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
