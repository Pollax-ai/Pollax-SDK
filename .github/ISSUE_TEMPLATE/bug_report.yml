name: Bug report
description: Report a problem with the Pollax SDK
labels: ["bug"]
body:
  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      options:
        - TypeScript / JavaScript (npm `pollax`)
        - Python (PyPI `pollax`)
        - Both / unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install pollax@…
        2. Call …
        3. See error …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        Node 20 / Python 3.11
        OS: macOS …
